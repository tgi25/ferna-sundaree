<!doctype html><html><head><meta charset="utf-8"><title>Microphone and speaker check</title></head>
<body><h1>Microphone and speaker check</h1>
<p>What microphone-test, dictation, voice-chat and call sites do: ask for the microphone alone,
read the permission state, list microphones and speakers, measure the input level, play to a
chosen speaker, and use the microphone from an embedded frame.</p>
<script>
const q = async n => { try { return (await navigator.permissions.query({ name: n })).state; } catch (e) { return 'error:' + e.name; } };
window.watch = async () => { const st = await navigator.permissions.query({ name: 'microphone' }); window.seen = []; st.onchange = () => window.seen.push(st.state); return st.state; };
window.state = async () => ({ mic: await q('microphone'), cam: await q('camera') });
window.devices = async () => (await navigator.mediaDevices.enumerateDevices()).map(d => ({ kind: d.kind, label: d.label, id: d.deviceId ? d.deviceId : '' }));
window.mic = async () => {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    window.stream = s;
    return { ok: true, tracks: s.getTracks().map(t => t.kind + ':' + t.label) };
  } catch (e) { return { ok: false, error: e.name }; }
};
// Input level, as a mic-test page draws its meter
window.level = async () => {
  const ctx = new AudioContext();
  const src = ctx.createMediaStreamSource(window.stream);
  const an = ctx.createAnalyser(); an.fftSize = 2048; src.connect(an);
  const buf = new Float32Array(an.fftSize); let peak = 0;
  for (let i = 0; i < 20; i++) { await new Promise(r => setTimeout(r, 50)); an.getFloatTimeDomainData(buf); for (const v of buf) peak = Math.max(peak, Math.abs(v)); }
  await ctx.close();
  return peak;
};
// Play a tone to each speaker the page can see (an <audio> element and Web Audio)
window.speakers = async () => {
  const outs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audiooutput');
  const res = [];
  for (const d of outs) {
    const a = new Audio();
    let el = 'ok', wa = 'n/a';
    try { await a.setSinkId(d.deviceId); } catch (e) { el = e.name; }
    if ('setSinkId' in AudioContext.prototype) {
      const ctx = new AudioContext();
      try { await ctx.setSinkId(d.deviceId); wa = 'ok'; } catch (e) { wa = e.name; }
      await ctx.close();
    }
    res.push({ id: d.deviceId, label: d.label, element: el, webAudio: wa });
  }
  return res;
};
window.record = async () => {
  const r = new MediaRecorder(window.stream); const parts = [];
  r.ondataavailable = e => parts.push(e.data);
  r.start(); await new Promise(res => setTimeout(res, 600)); r.stop();
  await new Promise(res => { r.onstop = res; });
  return parts.reduce((n, b) => n + b.size, 0);
};
window.frameMic = (src, allow) => new Promise(resolve => {
  const f = document.createElement('iframe');
  if (allow != null) f.allow = allow;
  f.src = src;
  const done = e => { if (e.source === f.contentWindow) { removeEventListener('message', done); f.remove(); resolve(e.data); } };
  addEventListener('message', done);
  document.body.appendChild(f);
  setTimeout(() => resolve('timeout'), 8000);
});
window.stop = () => { if (window.stream) window.stream.getTracks().forEach(t => t.stop()); };
</script></body></html>
