<body><div class="wrap"><p id="p">Normal paragraph text at 16 px.</p><p class="small" id="small">Small print at 12 px.</p>
<div class="em" id="em">Relative 1.5em text <span id="inner">inner</span></div><img id="img" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></div>
<script>setTimeout(()=>{const d=document.createElement('p');d.id='late';d.textContent='Loaded later';d.className='small';document.querySelector('.wrap').appendChild(d);},1500);</script>
</body></html>
