<!doctype html><html><head><meta charset="utf-8"><title>Fake YouTube: video that stops itself</title></head><body>
<div class="html5-video-player" id="player"><video id="v" src="media.webm" autoplay muted loop></video></div>
<script>
  // Like YouTube's player in some ad-blocking browsers: stops the video right after it starts.
  const v = document.getElementById('v');
  window.__selfPaused = 0;
  v.addEventListener('playing', () => { if (!window.__selfPaused) setTimeout(() => { window.__selfPaused++; v.pause(); }, 300); }, { once: true });
</script>
</body></html>
