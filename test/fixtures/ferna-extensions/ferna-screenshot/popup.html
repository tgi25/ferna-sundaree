<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ferna Screenshot</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 340px; padding: 14px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header img { width: 34px; height: 34px; border-radius: 8px; }
  header h1 { font-size: 16px; margin: 0; line-height: 1.1; }
  header p { margin: 2px 0 0; font-size: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cap { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 12px; border-radius: var(--radius);
    background: var(--panel); border: 1px solid var(--line); cursor: pointer; box-shadow: var(--shadow); transition: .12s; }
  .cap:hover { border-color: var(--accent); transform: translateY(-1px); }
  .cap .i { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .cap .i svg { width: 20px; height: 20px; }
  .cap b { font-size: 13.5px; }
  .cap small { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
  .cap kbd { margin-top: 2px; }
  .opts { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 9px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
  .row select { padding: 4px 6px; font-size: 13px; }
  footer { display: flex; gap: 6px; margin-top: 12px; }
  footer .btn { flex: 1; justify-content: center; padding: 7px 6px; }
  .warn { display: none; margin-top: 10px; font-size: 12px; color: #b45309; background: #fef3c7; border-radius: 8px; padding: 7px 9px; }
  @media (prefers-color-scheme: dark) { .warn { background: #422006; color: #fcd34d; } }
</style>
</head>
<body>
<header>
  <img src="icons/icon48.png" alt="">
  <div><h1>Ferna Screenshot</h1><p class="muted">Capture, stamp, mark up and save</p></div>
</header>

<div class="grid">
  <button class="cap" data-mode="visible">
    <span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg></span>
    <b>Visible area</b><small>What is on screen now</small><kbd data-cmd="capture-visible"></kbd>
  </button>
  <button class="cap" data-mode="full">
    <span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 7v10M9 14l3 3 3-3"/></svg></span>
    <b>Entire page</b><small>Scrolls and stitches the whole page</small><kbd data-cmd="capture-full"></kbd>
  </button>
  <button class="cap" data-mode="region">
    <span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M12 9v6M9 12h6"/></svg></span>
    <b>Select region</b><small>Drag; may run past the screen</small><kbd data-cmd="capture-region"></kbd>
  </button>
  <button class="cap" data-mode="element">
    <span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="2" stroke-dasharray="3 3"/><path d="M13 13l7 3-3 1-1 3z"/></svg></span>
    <b>Select element</b><small>A card, table, post or chart</small><kbd data-cmd="capture-element"></kbd>
  </button>
</div>

<div class="opts">
  <label class="check row"><span>Add page address &amp; time stamp</span><input type="checkbox" id="stamp"></label>
  <div class="row"><span>Stamp position</span>
    <select id="placement">
      <option value="corner:auto">Best corner (automatic)</option>
      <option value="corner:tl">Top-left corner</option>
      <option value="corner:tr">Top-right corner</option>
      <option value="corner:bl">Bottom-left corner</option>
      <option value="corner:br">Bottom-right corner</option>
      <option value="footer">Strip below the picture</option>
      <option value="header">Strip above the picture</option>
    </select></div>
  <div class="row"><span>Delay (visible / entire page)</span>
    <select id="delay"><option value="0">None</option><option value="3">3 s</option><option value="5">5 s</option><option value="10">10 s</option></select></div>
  <div class="row"><span>After capture</span>
    <select id="after"><option value="editor">Open the editor</option><option value="save">Save immediately</option></select></div>
  <div class="row" id="fmtRow"><span>Save as</span>
    <select id="fmt"><option value="png">PNG</option><option value="jpg">JPG</option><option value="pdf">PDF</option></select></div>
</div>

<div class="warn" id="warn">This page can't be scrolled by extensions (browser pages, the Web Store, the PDF viewer). Only the visible area can be captured here.</div>

<footer>
  <button class="btn" id="history">History</button>
  <button class="btn" id="settings">Settings</button>
  <button class="btn" id="keys">Shortcuts</button>
</footer>
<script type="module" src="popup.js"></script>
</body>
</html>
