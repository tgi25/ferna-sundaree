<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 136 136">
  <!-- Ferna Sundaree icon: Sundaree (orange tabby) and Siri (black cat with glasses) share one face. 48 px and up; build/icon-small.svg is drawn for 32 px and below. -->
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#FFA23A"/><stop offset="1" stop-color="#F0590A"/></linearGradient>
    <linearGradient id="bk" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#3A3D4A"/><stop offset="1" stop-color="#101118"/></linearGradient>
    <path id="sil" d="M14 52 L17 8 L45 27 Q53 24 58 24 L62 23 L66 23 L70 24 Q75 24 83 27 L111 8 L114 52 Q122 66 120 80 A56 48 0 0 1 8 80 Q6 66 14 52 Z"/>
    <clipPath id="L"><path d="M0 0 H66 Q58 50 66 70 Q74 96 62 128 H0Z"/></clipPath>
    <clipPath id="R"><path d="M128 0 H66 Q58 50 66 70 Q74 96 62 128 H128Z"/></clipPath>
  </defs>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
  <use href="#sil" fill="none" stroke="url(#rim)" stroke-width="9" stroke-linejoin="round"/>
  <use href="#sil" fill="url(#or)" clip-path="url(#L)"/>
  <use href="#sil" fill="url(#bk)" clip-path="url(#R)"/>
  <!-- inner ears -->
  <path d="M21 18 L23 40 L38 30Z" fill="#FFD9B3"/>
  <path d="M107 18 L105 40 L90 30Z" fill="#F472B6" opacity=".9"/>
  <!-- Sundaree: tabby stripes + dark eyes -->
  <path d="M30 34 q3 6 2 12 M40 30 q2 7 1 13" stroke="#C2410C" stroke-width="4" stroke-linecap="round" fill="none"/>
  <ellipse cx="34" cy="66" rx="7" ry="9" fill="#1F2937"/><circle cx="36.5" cy="62.5" r="2.6" fill="#fff"/>
  <!-- Siri: yellow eyes in glasses -->
  <circle cx="92" cy="66" r="12" fill="#FFD43B" stroke="#E5E7EB" stroke-width="4"/>
  <ellipse cx="92" cy="66" rx="3" ry="7.5" fill="#101118"/>
  <path d="M80 66 H70" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
  <!-- where the two cats meet -->
  <path d="M66 23 Q58 50 66 70 Q74 96 62 120" stroke="#fff" stroke-opacity=".55" stroke-width="2.2" fill="none"/>
  <!-- one shared nose and smile -->
  <path d="M59 82 h11 l-5.5 6.5z" fill="#F472B6"/>
  <path d="M64.5 88.5 q-5 5 -10 2 M64.5 88.5 q5 5 10 2" stroke="#7C2D12" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</svg>
