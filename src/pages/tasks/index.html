<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task manager</title>
<link rel="stylesheet" href="/_shared/base.css">
<style>
  .page { max-width: 1100px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); padding: 6px 8px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .t { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 520px; }
  .t .ti { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t .favicon, .t .letter { width: 16px; height: 16px; flex: none; border-radius: 3px; }
  .t .letter { display: grid; place-items: center; font-size: 10px; color: #fff; font-weight: 700; }
  .state { font-size: 12px; border-radius: 999px; padding: 1px 8px; background: var(--bg-sunken); }
  .state.active { background: var(--accent-soft); color: var(--accent); }
  .state.sleeping { color: var(--ink-3); }
  .acts { display: flex; gap: 4px; justify-content: flex-end; }
  .sum { display: flex; gap: 22px; margin: 0 0 14px; flex-wrap: wrap; }
  .sum b { font-size: 20px; display: block; }
  tr.hi td { background: var(--accent-soft); }
</style>
</head>
<body>
  <div class="page">
    <h1>Task manager</h1>
    <p class="lead">Memory and processor use of every tab. Tabs you have not used for a while go to sleep automatically (Settings → Tabs and bars); a sleeping tab uses no memory and reloads when you open it.</p>
    <div class="sum" id="sum"></div>
    <div class="card"><table><thead><tr><th data-s="title">Tab</th><th data-s="state">State</th><th class="num" data-s="memory">Memory</th><th class="num" data-s="cpu">CPU</th><th class="num">Process</th><th></th></tr></thead><tbody id="tabs"></tbody></table></div>
    <h2 style="font-size:15px">Browser processes</h2>
    <div class="card"><table><thead><tr><th>Process</th><th class="num">Memory</th><th class="num">CPU</th><th class="num">Process ID</th></tr></thead><tbody id="other"></tbody></table></div>
  </div>
  <script src="/_shared/kit.js"></script>
  <script src="tasks.js"></script>
</body>
</html>
